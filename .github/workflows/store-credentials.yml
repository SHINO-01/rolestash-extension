name: Check store credentials

# Run by hand after setting or rotating the Chrome Web Store secrets, to check
# them without releasing anything, and to see what the store says about the
# item (why a publish was refused). Needs the same approval as an upload.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check store credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: chrome-web-store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check store credentials
        env:
          EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          STORE_STATUS: '1'
        run: bash scripts/check-store-credentials.sh
